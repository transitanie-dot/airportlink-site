<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coverage · Airportlink</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">

<style>
/* ============================================================
   ONDE PODEMOS OPERAR

   A primeira versão era um mapa mundial com 801 pontos. Não se
   lia: tudo tinha o mesmo peso visual, e um aeroporto com dez
   reservas parecia igual a um onde nunca ninguém reservou.

   Com três parceiros e trinta reservas, o que interessa cabe numa
   lista de dez linhas. O mapa fica como apoio, para se ver onde as
   coisas estão.
   ============================================================ */
:root{
  --bg:#FAFAF8; --card:#FFFFFF; --card-2:#F4F4F1;
  --text:#1A1A17; --muted:#6B6B63;
  --border:#E4E4DE; --border-soft:#EFEFEA;
  --teal:#0D9488;
  --ok:#16A34A; --warn:#CA8A04; --bad:#DC2626;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
}

[data-theme="dark"]{
  --bg:#0F1115; --card:#171A20; --card-2:#1E222A;
  --text:#F0F0EC; --muted:#9A9A93;
  --border:#282D36; --border-soft:#21252C;
}

*{box-sizing:border-box}

body{margin:0;font-family:var(--sans);background:var(--bg);
  color:var(--text);-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.5}

.wrap{max-width:820px;margin:0 auto;padding:0 20px 80px}

/* ---------- o cabeçalho ---------- */
.top{display:flex;align-items:baseline;gap:14px;padding:26px 0 20px;
  flex-wrap:wrap}
.top h1{margin:0;font-size:21px;font-weight:600}
.top .when{font-size:12.5px;color:var(--muted)}
.grow{flex:1 1 auto}

.btn{padding:6px 13px;border-radius:9px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:inherit;
  font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{color:var(--text)}
.btn.on{background:var(--text);color:var(--card);border-color:var(--text)}

/* ---------- a frase que resume ----------
   Um número sozinho não decide nada. Uma frase decide. */
.lede{margin:0 0 26px;padding:18px 20px;border-radius:14px;
  background:var(--card);border:1px solid var(--border);
  font-size:16px;line-height:1.6}
.lede b{font-weight:600}
.lede .big{font-family:var(--mono);font-size:19px;font-weight:600}
.lede .bad{color:var(--bad)}
.lede .ok{color:var(--ok)}

/* ---------- a lista, que é o principal ---------- */
h2{margin:30px 0 4px;font-size:15px;font-weight:600}
h2 + .sub{margin:0 0 14px;font-size:13px;color:var(--muted)}

.rows{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.rows:empty{display:none}

.row{display:flex;align-items:center;gap:12px;padding:13px 16px;
  background:var(--card);font-size:14px}
.row + .row{border-top:1px solid var(--border-soft)}

.pip{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.pip.full{background:var(--ok)}
.pip.partial{background:var(--warn)}
.pip.none{background:var(--bad)}

.row .place{flex:1 1 auto;min-width:0}
.row .place b{display:block;font-weight:600}
.row .place span{font-size:12.5px;color:var(--muted)}

/* O que falta, em palavras. É o que se leva para a conversa com
   um parceiro novo. */
.need{font-size:12.5px;color:var(--bad);font-weight:600;
  flex:0 0 auto;text-align:right}
.need.ok{color:var(--ok)}

.dem{font-family:var(--mono);font-size:13px;font-weight:600;
  flex:0 0 auto;min-width:66px;text-align:right}
.dem span{display:block;font-family:var(--sans);font-size:11px;
  font-weight:400;color:var(--muted)}

.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px;
  background:var(--card);border:1px solid var(--border);border-radius:14px}

/* ---------- o mapa, em baixo e recolhido ----------
   Serve para ver ONDE as coisas estão. A lista já disse o quê. */
.map-head{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
.map-head h2{margin:0}

.regions{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.regions .btn{padding:5px 11px;font-size:12px}

.map-box{border:1px solid var(--border);border-radius:14px;
  overflow:hidden;background:var(--card-2)}

svg.map{display:block;width:100%;height:auto}

.land{fill:var(--border);opacity:.55}
[data-theme="dark"] .land{opacity:.32}

.dot{stroke:var(--card-2);stroke-width:1.2}
.dot.full{fill:var(--ok)}
.dot.partial{fill:var(--warn)}
.dot.none{fill:var(--bad);opacity:.35}

/* Os que têm procura destacam-se: são os que interessam. */
.dot.hasdemand{opacity:1;stroke-width:2;stroke:var(--card)}
[data-theme="dark"] .dot.hasdemand{stroke:var(--card-2)}

/* ---------- o portão ---------- */
.gate{max-width:360px;margin:90px auto;padding:28px;
  background:var(--card);border:1px solid var(--border);border-radius:18px}
.gate h1{margin:0 0 6px;font-size:19px}
.gate p{margin:0 0 18px;font-size:13.5px;color:var(--muted)}

.gate input{width:100%;padding:11px 14px;margin-bottom:10px;
  border:1px solid var(--border);border-radius:10px;
  background:var(--card-2);font-family:inherit;font-size:15px;
  color:var(--text)}
.gate input:focus{outline:none;border-color:var(--teal)}

.gate button{width:100%;padding:11px;border:none;border-radius:10px;
  background:var(--teal);color:#fff;font-family:inherit;font-size:14px;
  font-weight:600;cursor:pointer}

.err{margin-top:12px;padding:10px 13px;border-radius:9px;
  background:rgba(220,38,38,.1);color:var(--bad);font-size:13px;
  display:none}

@media (max-width:560px){
  .wrap{padding:0 14px 60px}
  .row{flex-wrap:wrap}
  .need{flex:1 1 100%;text-align:left;order:3}
  .lede{font-size:15px}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Coverage</h1>
  <p>Where we can operate, and where we cannot.
     Administrator sign-in required.</p>

  <input type="email" id="email" placeholder="Email" autocomplete="username">
  <input type="password" id="pass" placeholder="Password"
         autocomplete="current-password">
  <button id="signIn" type="button">Sign in</button>

  <div class="err" id="gateErr"></div>
</div>


<div class="wrap" id="app" hidden>

  <div class="top">
    <h1>Coverage</h1>
    <span class="when" id="when"></span>
    <span class="grow"></span>
    <button class="btn" id="theme" type="button">Dark</button>
  </div>

  <!-- A frase que resume. Um número sozinho não decide nada. -->
  <p class="lede" id="lede"></p>

  <h2>Where the bookings are</h2>
  <p class="sub">The airports people are actually booking from, and
     whether we can serve them.</p>
  <div class="rows" id="withDemand"></div>

  <h2>Covered, no bookings yet</h2>
  <p class="sub">We have partners here. Nobody has booked in 90 days.</p>
  <div class="rows" id="quiet"></div>

  <div class="map-head">
    <h2>On the map</h2>
    <span class="grow"></span>
    <button class="btn" id="mapToggle" type="button">Show</button>
  </div>

  <div id="mapArea" hidden>
    <div class="regions" id="regions"></div>
    <div class="map-box">
      <svg id="map" class="map" viewBox="0 0 1200 620"></svg>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://airportlink.onrender.com/api/maps/config.js"></script>

<script>
(function () {
'use strict';

var CFG = window.MAP_CFG || {};
var API = CFG.apiUrl || 'https://airportlink.onrender.com';

var $ = function (id) { return document.getElementById(id); };
var qsa = function (s) {
  return Array.prototype.slice.call(document.querySelectorAll(s));
};

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) {
  $('gateErr').textContent = 'The server did not send the sign-in settings. ' +
    'Check SUPABASE_URL and SUPABASE_ANON_KEY on Render.';
  $('gateErr').style.display = 'block';
  return;
}

var db = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);

var dados = null;
var regiao = 'all';


// ============================================================
// O PORTÃO
// ============================================================

$('signIn').addEventListener('click', async function () {
  var b = $('signIn');
  b.disabled = true;
  b.textContent = 'Signing in...';
  $('gateErr').style.display = 'none';

  try {
    var r = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('pass').value
    });

    if (r.error) throw new Error(r.error.message);
    await carregar();
  } catch (e) {
    $('gateErr').textContent = e.message;
    $('gateErr').style.display = 'block';
    b.disabled = false;
    b.textContent = 'Sign in';
  }
});

['email', 'pass'].forEach(function (id) {
  $(id).addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('signIn').click();
  });
});


async function carregar() {
  try {
    var s = await db.auth.getSession();
    var token = s.data && s.data.session && s.data.session.access_token;

    if (!token) throw new Error('Sign in again.');

    var res = await fetch(API + '/api/maps/data', {
      headers: { Authorization: 'Bearer ' + token }
    });

    var d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Could not load.');

    dados = d;
    $('gate').hidden = true;
    $('app').hidden = false;

    desenhar();
  } catch (e) {
    $('gateErr').textContent = e.message;
    $('gateErr').style.display = 'block';
    $('signIn').disabled = false;
    $('signIn').textContent = 'Sign in';
  }
}


// ============================================================
// A LISTA
//
// É a peça principal. O mapa mostra onde as coisas estão; a lista
// diz o que fazer com elas.
// ============================================================

function desenhar() {
  var cob = dados.coverage || [];
  var res = dados.bookings || [];

  // A procura, por aeroporto.
  var procura = {};
  res.forEach(function (b) { procura[b.iata] = b; });

  /**
   * Os que têm reservas.
   *
   * São estes que interessam hoje: procura que existe, e cobertura
   * que existe ou não. Tudo o resto é potencial.
   */
  var comProcura = cob
    .filter(function (z) { return (procura[z.iata] || {}).total > 0; })
    .map(function (z) {
      return Object.assign({}, z, { demand: procura[z.iata] });
    })
    .sort(function (a, b) { return b.demand.total - a.demand.total; });

  // E os que temos cobertos sem ninguém a reservar.
  var calados = cob
    .filter(function (z) {
      return z.partners > 0 && !(procura[z.iata] || {}).total;
    })
    .sort(function (a, b) { return b.partners - a.partners; });

  // ---------- a frase ----------
  var semCobertura = comProcura.filter(function (z) { return z.status !== 'full'; });

  var perdidas = semCobertura.reduce(function (n, z) {
    return n + z.demand.total;
  }, 0);

  if (!comProcura.length) {
    $('lede').innerHTML = 'No bookings in the last 90 days.';
  } else if (!semCobertura.length) {
    $('lede').innerHTML =
      '<span class="big ok">' + comProcura.length + '</span> airport' +
      (comProcura.length === 1 ? '' : 's') +
      ' with bookings, and we cover them all.';
  } else {
    /**
     * O número que decide onde recrutar.
     *
     * "Doze reservas em três aeroportos onde não temos ninguém" é
     * uma frase que se lê e se age. "12" sozinho não é.
     */
    $('lede').innerHTML =
      '<span class="big bad">' + perdidas + '</span> booking' +
      (perdidas === 1 ? '' : 's') + ' in the last 90 days came from ' +
      '<b>' + semCobertura.length + ' airport' +
      (semCobertura.length === 1 ? '' : 's') + '</b> where we cannot ' +
      'guarantee a car.' +
      (comProcura.length > semCobertura.length
        ? ' The other ' + (comProcura.length - semCobertura.length) +
          ' we cover.'
        : '');
  }

  $('when').textContent = dados.generated_at
    ? new Date(dados.generated_at).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      })
    : '';

  // ---------- as duas listas ----------
  $('withDemand').innerHTML = comProcura.length
    ? comProcura.map(linhaComProcura).join('')
    : '<div class="empty">No bookings in the last 90 days.</div>';

  $('quiet').innerHTML = calados.length
    ? calados.map(linhaCalada).join('')
    : '<div class="empty">Nothing yet.</div>';

  pintarRegioes();
  if (!$('mapArea').hidden) pintarMapa();
}


function linhaComProcura(z) {
  var d = z.demand || {};

  return '<div class="row">' +
    '<span class="pip ' + z.status + '"></span>' +

    '<span class="place"><b>' + esc(z.city || z.iata) + '</b>' +
      '<span>' + esc(z.country || '') + ' · ' +
      esc(z.sedans) + ' sedan, ' + esc(z.vans) + ' van' +
      '</span></span>' +

    /**
     * O que falta, em palavras.
     *
     * "Needs 2 sedan 1 van" leva-se para a conversa com um parceiro
     * novo. Um ponto vermelho não.
     */
    (z.status === 'full'
      ? '<span class="need ok">covered</span>'
      : '<span class="need">needs ' + esc((z.missing || '').trim() || 'drivers') +
        '</span>') +

    '<span class="dem">' + esc(d.total) +
      '<span>bookings</span></span>' +

    '</div>';
}


function linhaCalada(z) {
  return '<div class="row">' +
    '<span class="pip ' + z.status + '"></span>' +
    '<span class="place"><b>' + esc(z.city || z.iata) + '</b>' +
      '<span>' + esc(z.country || '') + '</span></span>' +
    '<span class="dem">' + esc(z.partners) +
      '<span>partner' + (z.partners === 1 ? '' : 's') + '</span></span>' +
    '</div>';
}


// ============================================================
// O MAPA
//
// Recolhido por omissão. Serve para ver ONDE as coisas estão — a
// lista já disse o quê.
// ============================================================

var L = 1200, A = 620;

function proj(lat, lng) {
  var x = (Number(lng) + 180) / 360 * L;
  var r = Number(lat) * Math.PI / 180;
  var m = Math.log(Math.tan(Math.PI / 4 + r / 2));
  var cima = Math.log(Math.tan(Math.PI / 4 + (72 * Math.PI / 180) / 2));
  var baixo = Math.log(Math.tan(Math.PI / 4 + (-55 * Math.PI / 180) / 2));
  return { x: x, y: A - ((m - baixo) / (cima - baixo)) * A };
}

var MUNDO =
  'M560,105 L625,92 L672,112 L690,158 L672,200 L625,218 L588,242 ' +
  'L560,278 L528,300 L504,275 L516,228 L540,192 L546,140 Z ' +
  'M690,112 L840,92 L960,120 L1032,168 L1056,228 L1008,276 L936,288 ' +
  'L864,258 L792,228 L720,192 L694,150 Z ' +
  'M564,282 L636,270 L684,300 L696,372 L666,444 L612,474 L570,444 ' +
  'L546,372 L552,318 Z ' +
  'M144,96 L300,84 L372,120 L360,180 L312,228 L264,258 L228,306 ' +
  'L198,276 L180,216 L144,168 Z ' +
  'M300,318 L366,306 L396,360 L384,444 L348,504 L318,474 L300,408 Z ' +
  'M972,384 L1056,378 L1080,426 L1038,468 L984,450 L966,414 Z';

/**
 * As regiões, por caixa no mapa.
 *
 * Um mapa mundial com oitocentos pontos não se lê. Um da Europa
 * com duzentos e setenta lê-se bem — e é onde estão quase todas as
 * reservas.
 */
var REGIOES = {
  all:      { label: 'World',    x: [0, 1200],   y: [0, 620] },
  europe:   { label: 'Europe',   x: [520, 760],  y: [70, 300] },
  americas: { label: 'Americas', x: [100, 420],  y: [60, 540] },
  asia:     { label: 'Asia',     x: [700, 1120], y: [80, 400] },
  africa:   { label: 'Africa',   x: [500, 720],  y: [230, 500] },
  oceania:  { label: 'Oceania',  x: [900, 1160], y: [330, 560] }
};

function pintarRegioes() {
  $('regions').innerHTML = Object.keys(REGIOES).map(function (k) {
    return '<button class="btn' + (k === regiao ? ' on' : '') +
      '" data-region="' + k + '" type="button">' +
      esc(REGIOES[k].label) + '</button>';
  }).join('');

  qsa('#regions [data-region]').forEach(function (b) {
    b.addEventListener('click', function () {
      regiao = b.getAttribute('data-region');
      pintarRegioes();
      pintarMapa();
    });
  });
}

function pintarMapa() {
  var cob = dados.coverage || [];
  var res = dados.bookings || [];

  var procura = {};
  res.forEach(function (b) { procura[b.iata] = b.total; });

  var r = REGIOES[regiao];

  var svg = '<path class="land" d="' + MUNDO + '"/>' +
    cob.map(function (z) {
      var p = proj(z.lat, z.lng);

      // Fora da região escolhida.
      if (p.x < r.x[0] || p.x > r.x[1] || p.y < r.y[0] || p.y > r.y[1]) {
        return '';
      }

      /**
       * Os que têm procura destacam-se.
       *
       * Os outros ficam esbatidos: existem, mas não são o que se
       * anda a olhar. Sem isto, oitocentos pontos vermelhos iguais
       * escondem os cinco que importam.
       */
      var tem = procura[z.iata] > 0;
      var raio = tem ? Math.min(13, 5 + Math.sqrt(procura[z.iata]) * 2) : 3.5;

      return '<circle class="dot ' + z.status + (tem ? ' hasdemand' : '') +
        '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) +
        '" r="' + raio.toFixed(1) + '"><title>' +
        esc(z.city + (tem ? ' · ' + procura[z.iata] + ' bookings' : '')) +
        '</title></circle>';
    }).join('');

  var m = $('map');
  m.innerHTML = svg;

  // A vista aproxima-se da região, em vez de mostrar o mundo todo.
  m.setAttribute('viewBox',
    r.x[0] + ' ' + r.y[0] + ' ' +
    (r.x[1] - r.x[0]) + ' ' + (r.y[1] - r.y[0]));
}


$('mapToggle').addEventListener('click', function () {
  var area = $('mapArea');
  area.hidden = !area.hidden;

  $('mapToggle').textContent = area.hidden ? 'Show' : 'Hide';

  if (!area.hidden) pintarMapa();
});

$('theme').addEventListener('click', function () {
  var escuro = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', escuro ? 'light' : 'dark');
  $('theme').textContent = escuro ? 'Dark' : 'Light';
});


// Se já houver sessão, entra direto.
(async function () {
  var s = await db.auth.getSession();
  if (s.data && s.data.session) carregar();
})();

})();
</script>
</body>
</html>

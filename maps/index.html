<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coverage · Airportlink</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">

<style>
/* ============================================================
   ONDE PODEMOS OPERAR

   Continente, país, aeroporto. Cada nível abre o seguinte, e só
   se carrega o que se abre — 801 aeroportos de uma vez não se
   navegam.

   As cores dizem o estado:
     verde     dois sedans, duas vans, dois motoristas
     âmbar     há frota mas não chega, ou há alguém em análise
     vermelho  ninguém
   ============================================================ */
:root{
  --bg:#FAFAF8; --card:#FFFFFF; --card-2:#F4F4F1;
  --text:#1A1A17; --muted:#6B6B63;
  --border:#E4E4DE; --border-soft:#EFEFEA;
  --teal:#0D9488;
  --ok:#16A34A; --warn:#CA8A04; --bad:#DC2626;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
}

[data-theme="dark"]{
  --bg:#0F1115; --card:#171A20; --card-2:#1E222A;
  --text:#F0F0EC; --muted:#9A9A93;
  --border:#282D36; --border-soft:#21252C;
}

*{box-sizing:border-box}

body{margin:0;font-family:var(--sans);background:var(--bg);
  color:var(--text);-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.5}

.wrap{max-width:880px;margin:0 auto;padding:0 20px 80px}

.top{display:flex;align-items:baseline;gap:14px;padding:26px 0 18px;
  flex-wrap:wrap}
.top h1{margin:0;font-size:21px;font-weight:600}
.top .when{font-size:12.5px;color:var(--muted)}
.grow{flex:1 1 auto}

.btn{padding:6px 13px;border-radius:9px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:inherit;
  font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{color:var(--text)}
.btn.on{background:var(--text);color:var(--card);border-color:var(--text)}

/* ---------- a frase que resume ---------- */
.lede{margin:0 0 24px;padding:17px 20px;border-radius:14px;
  background:var(--card);border:1px solid var(--border);
  font-size:16px;line-height:1.6}
.lede .big{font-family:var(--mono);font-size:19px;font-weight:600}
.lede .bad{color:var(--bad)}
.lede .ok{color:var(--ok)}

/* ---------- a pesquisa ---------- */
.find{width:100%;padding:11px 15px;margin-bottom:20px;
  border:1px solid var(--border);border-radius:11px;
  background:var(--card);font-family:inherit;font-size:14.5px;
  color:var(--text)}
.find:focus{outline:none;border-color:var(--teal)}

/* ============================================================
   AS TRÊS LISTAS DO TOPO

   A árvore serve para procurar. Estas servem para decidir.
   ============================================================ */
.panel{border:1px solid var(--border);border-radius:14px;
  margin-bottom:10px;overflow:hidden;background:var(--card)}
.panel[hidden]{display:none}

.panel-head{display:flex;align-items:center;gap:12px;width:100%;
  padding:15px 18px;background:transparent;border:none;cursor:pointer;
  font-family:inherit;font-size:15.5px;color:var(--text);text-align:left}
.panel-head:hover{background:var(--card-2)}
.panel-head b{font-weight:600;flex:0 0 auto}

.sub-inline{font-size:12.5px;color:var(--muted);flex:1 1 auto}

.count{font-family:var(--mono);font-size:13px;font-weight:600;
  padding:2px 10px;border-radius:999px;flex:0 0 auto;
  margin-left:auto;background:var(--card-2);color:var(--muted)}
.count.warn{background:rgba(202,138,4,.15);color:var(--warn)}
.count.bad{background:rgba(220,38,38,.12);color:var(--bad)}
.count.ok{background:rgba(22,163,74,.13);color:var(--ok)}

.panel-body{border-top:1px solid var(--border-soft)}
.panel-body[hidden]{display:none}

.item{display:flex;align-items:center;gap:12px;padding:12px 18px;
  font-size:13.5px}
.item + .item{border-top:1px solid var(--border-soft)}

.item .nm{flex:1 1 auto;min-width:0}
.item .nm b{display:block;font-weight:600}
.item .nm span{font-size:12.5px;color:var(--muted)}

/* Os dias à espera. Uma candidatura parada é um parceiro que
   desiste — e a partir de três dias isso grita. */
.days{font-family:var(--mono);font-size:12px;font-weight:600;
  flex:0 0 auto;color:var(--muted)}
.days.late{color:var(--bad)}

.codes{display:flex;gap:4px;flex-wrap:wrap;flex:0 0 auto}
.code-chip{font-family:var(--mono);font-size:10.5px;padding:2px 6px;
  border-radius:5px;background:var(--card-2);color:var(--muted)}

.tree-title{margin:34px 0 12px;font-size:15px;font-weight:600}

/* ============================================================
   A ÁRVORE
   ============================================================ */
.tree{border:1px solid var(--border);border-radius:14px;overflow:hidden}

/* ---------- continente ---------- */
.cont{background:var(--card)}
.cont + .cont{border-top:1px solid var(--border)}

.cont-head{display:flex;align-items:center;gap:12px;width:100%;
  padding:15px 18px;background:transparent;border:none;cursor:pointer;
  font-family:inherit;font-size:15.5px;color:var(--text);text-align:left}
.cont-head:hover{background:var(--card-2)}
.cont-head b{font-weight:600;flex:1 1 auto}

.caret{font-size:11px;color:var(--muted);transition:transform .15s;
  flex:0 0 auto}
.cont.open .caret{transform:rotate(90deg)}

/* ---------- país ---------- */
.country{background:var(--card-2)}
.country + .country{border-top:1px solid var(--border-soft)}

.ct-head{display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 18px 11px 34px;background:transparent;border:none;
  cursor:pointer;font-family:inherit;font-size:14px;color:var(--text);
  text-align:left}
.ct-head:hover{background:var(--border-soft)}
.ct-head b{font-weight:500;flex:1 1 auto}

/* Um país que precisa de gente marca-se no nome.
   Percorrer a lista à procura de números pequenos não é forma de
   encontrar onde falta. */
.country.needs .ct-head b{color:var(--bad);font-weight:600}
.country.needs .ct-head b::after{content:' ●';font-size:9px;
  vertical-align:middle}

/* ---------- aeroporto ---------- */
.airports{background:var(--card)}

.ap{display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 18px 11px 50px;background:transparent;border:none;
  cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--text);
  text-align:left}
.ap + .ap{border-top:1px solid var(--border-soft)}
.ap:hover{background:var(--card-2)}

.ap .code{font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--muted);flex:0 0 auto;width:34px}

.ap .place{flex:1 1 auto;min-width:0}
.ap .place b{font-weight:500}

/* O nível 1 destaca-se: são os grandes destinos, onde um parceiro
   novo tem trabalho desde o primeiro dia. */
.ap.tier1 .place b{font-weight:600}
.ap.tier1 .code{color:var(--text)}

.pip{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.pip.full{background:var(--ok)}
.pip.partial{background:var(--warn)}
.pip.pending{background:var(--warn)}
.pip.none{background:var(--bad)}

.state{font-size:12px;font-weight:600;flex:0 0 auto;text-align:right}
.state.full{color:var(--ok)}
.state.partial,.state.pending{color:var(--warn)}
.state.none{color:var(--bad)}

.bk{font-family:var(--mono);font-size:12px;font-weight:600;
  flex:0 0 auto;min-width:52px;text-align:right;color:var(--text)}
.bk.zero{color:var(--muted);font-weight:400}

/* ---------- as empresas ---------- */
.firms{padding:4px 18px 14px 50px;background:var(--card-2)}

.firm{display:flex;align-items:center;gap:11px;padding:9px 14px;
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;font-size:13px}
.firm + .firm{margin-top:6px}

.firm .nm{flex:1 1 auto;min-width:0}
.firm .nm b{display:block;font-weight:600}
.firm .nm span{font-size:12px;color:var(--muted)}

.tag{font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;
  border-radius:5px;flex:0 0 auto}
.tag.approved{background:rgba(22,163,74,.13);color:var(--ok)}
.tag.pending,.tag.submitted,.tag.in_review{
  background:rgba(202,138,4,.15);color:var(--warn)}
.tag.suspended,.tag.draft{background:var(--card-2);color:var(--muted)}

.nofirms{padding:11px 14px;font-size:13px;color:var(--muted);
  font-style:italic}

/* ============================================================
   O FUNIL DE RECRUTAMENTO

   Quem já se contactou, o que se disse, e em que ponto está. Sem
   isto, dois vendedores ligam à mesma empresa na mesma semana.
   ============================================================ */
.owner-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;
  margin-bottom:10px;border-radius:9px;background:var(--card);
  border:1px solid var(--border);font-size:12.5px}
.owner-bar .muted{color:var(--muted)}

.sec-label{font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);margin:14px 0 7px}

.mini-btn{padding:4px 10px;border-radius:7px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:inherit;
  font-size:11.5px;font-weight:600;cursor:pointer;margin-left:auto}
.mini-btn:hover{color:var(--text);border-color:var(--muted)}

.lead{padding:11px 14px;border:1px solid var(--border);border-radius:10px;
  background:var(--card);font-size:13px}
.lead + .lead{margin-top:7px}

.lead-top{display:flex;align-items:center;gap:10px;margin-bottom:3px}
.lead-top b{font-weight:600;flex:1 1 auto}

.lead-info{font-size:12.5px;color:var(--muted)}

/* A última coisa que se disse. É o que faz a diferença entre
   continuar uma conversa e começar outra do zero. */
.lead-note{margin-top:8px;padding:8px 11px;border-radius:8px;
  background:var(--card-2);font-size:12.5px;line-height:1.5}
.lead-note b{font-weight:600}

.lead-next{margin-top:6px;font-size:12px;font-weight:600;color:var(--warn)}

.lead-acts{display:flex;align-items:center;gap:10px;margin-top:9px}
.lead-acts .mini-btn{margin-left:0}
.lead-acts .muted{font-size:11.5px;color:var(--muted);margin-left:auto;
  font-family:var(--mono)}

.add-lead{width:100%;margin-top:10px;padding:9px;border-radius:9px;
  border:1px dashed var(--border);background:transparent;
  color:var(--muted);font-family:inherit;font-size:12.5px;
  font-weight:600;cursor:pointer}
.add-lead:hover{color:var(--text);border-color:var(--muted)}

/* As fases do funil. Verde no fim, âmbar a meio, cinzento nos
   que pararam. */
.tag.new{background:var(--card-2);color:var(--muted)}
.tag.contacted{background:rgba(37,99,235,.12);color:#2563EB}
.tag.interested{background:rgba(202,138,4,.15);color:var(--warn)}
.tag.signing{background:rgba(22,163,74,.13);color:var(--ok)}
.tag.applied{background:rgba(22,163,74,.18);color:var(--ok)}
.tag.declined,.tag.unreachable{background:var(--card-2);color:var(--muted)}

/* ---------- números pequenos ---------- */
.mini{display:flex;gap:8px;flex:0 0 auto;font-family:var(--mono);
  font-size:11.5px;color:var(--muted)}
.mini i{font-style:normal}
.mini .g{color:var(--ok)}
.mini .a{color:var(--warn)}
.mini .r{color:var(--bad)}

/* ---------- o portão ---------- */
.gate{max-width:360px;margin:90px auto;padding:28px;
  background:var(--card);border:1px solid var(--border);border-radius:18px}
.gate h1{margin:0 0 6px;font-size:19px}
.gate p{margin:0 0 18px;font-size:13.5px;color:var(--muted)}

.gate input{width:100%;padding:11px 14px;margin-bottom:10px;
  border:1px solid var(--border);border-radius:10px;
  background:var(--card-2);font-family:inherit;font-size:15px;
  color:var(--text)}
.gate input:focus{outline:none;border-color:var(--teal)}

.gate button{width:100%;padding:11px;border:none;border-radius:10px;
  background:var(--teal);color:#fff;font-family:inherit;font-size:14px;
  font-weight:600;cursor:pointer}

.err{margin-top:12px;padding:10px 13px;border-radius:9px;
  background:rgba(220,38,38,.1);color:var(--bad);font-size:13px;
  display:none}

.loading{padding:14px 50px;font-size:13px;color:var(--muted)}

@media (max-width:600px){
  .wrap{padding:0 12px 60px}
  .ap{padding-left:34px;flex-wrap:wrap}
  .ap .state{flex:1 1 100%;text-align:left;order:5;padding-left:45px}
  .firms{padding-left:34px}
  .ct-head{padding-left:28px}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Coverage</h1>
  <p>Where we can operate, and where we cannot.
     Administrator sign-in required.</p>

  <input type="email" id="email" placeholder="Email" autocomplete="username">
  <input type="password" id="pass" placeholder="Password"
         autocomplete="current-password">
  <button id="signIn" type="button">Sign in</button>

  <div class="err" id="gateErr"></div>
</div>


<div class="wrap" id="app" hidden>

  <div class="top">
    <h1>Coverage</h1>
    <span class="when" id="when"></span>
    <span class="grow"></span>
    <button class="btn" id="theme" type="button">Dark</button>
  </div>

  <p class="lede" id="lede"></p>

  <!-- ============ AS TRÊS LISTAS ============
       A árvore serve para procurar. Estas servem para decidir — e
       é isso que se faz ao abrir a página. -->

  <div class="panel" id="reviewPanel" hidden>
    <button class="panel-head" data-panel="review" type="button">
      <span class="caret">▶</span>
      <b>Waiting for us</b>
      <span class="count warn" id="reviewCount">0</span>
    </button>
    <div class="panel-body" id="reviewList" hidden></div>
  </div>

  <div class="panel">
    <button class="panel-head" data-panel="recruit" type="button">
      <span class="caret">▶</span>
      <b>Recruit next</b>
      <span class="sub-inline">Tier 1 airports without cover</span>
      <span class="count bad" id="recruitCount">0</span>
    </button>
    <div class="panel-body" id="recruitList" hidden></div>
  </div>

  <div class="panel">
    <button class="panel-head" data-panel="partners" type="button">
      <span class="caret">▶</span>
      <b>Our partners</b>
      <span class="count ok" id="partnersCount">0</span>
    </button>
    <div class="panel-body" id="partnersList" hidden></div>
  </div>


  <h2 class="tree-title">Everywhere else</h2>

  <!-- Procurar salta a árvore toda. Quem sabe o que quer não
       devia ter de abrir três níveis para lá chegar. -->
  <input type="text" id="find" class="find"
         placeholder="Jump to an airport or country — Faro, Dubai, Spain...">

  <div class="tree" id="tree"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://airportlink.onrender.com/api/maps/config.js"></script>

<script>
(function () {
'use strict';

var CFG = window.MAP_CFG || {};
var API = CFG.apiUrl || 'https://airportlink.onrender.com';

var $ = function (id) { return document.getElementById(id); };
var qsa = function (s, raiz) {
  return Array.prototype.slice.call((raiz || document).querySelectorAll(s));
};

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) {
  $('gateErr').textContent = 'The server did not send the sign-in settings. ' +
    'Check SUPABASE_URL and SUPABASE_ANON_KEY on Render.';
  $('gateErr').style.display = 'block';
  return;
}

var db = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);

var arvore = null;

/**
 * Os países já carregados.
 *
 * Abrir um país pede os aeroportos dele ao servidor. Guardá-los
 * evita pedir outra vez quando alguém fecha e reabre — o que
 * acontece muito ao navegar.
 */
var cache = {};


// ============================================================
// O PORTÃO
// ============================================================

$('signIn').addEventListener('click', async function () {
  var b = $('signIn');
  b.disabled = true;
  b.textContent = 'Signing in...';
  $('gateErr').style.display = 'none';

  try {
    var r = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('pass').value
    });

    if (r.error) throw new Error(r.error.message);
    await carregar();
  } catch (e) {
    $('gateErr').textContent = e.message;
    $('gateErr').style.display = 'block';
    b.disabled = false;
    b.textContent = 'Sign in';
  }
});

['email', 'pass'].forEach(function (id) {
  $(id).addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('signIn').click();
  });
});


async function pedir(caminho) {
  var s = await db.auth.getSession();
  var token = s.data && s.data.session && s.data.session.access_token;

  if (!token) throw new Error('Sign in again.');

  var res = await fetch(API + caminho, {
    headers: { Authorization: 'Bearer ' + token }
  });

  var d = await res.json();
  if (!res.ok) throw new Error(d.error || 'Could not load.');

  return d;
}


var resumo = null;

async function carregar() {
  try {
    /**
     * As duas chamadas ao mesmo tempo.
     *
     * Uma a seguir à outra seriam dois segundos cada no plano
     * gratuito do Render — quatro segundos a olhar para nada.
     */
    var r = await Promise.all([
      pedir('/api/maps/tree'),
      pedir('/api/maps/summary')
    ]);

    arvore = r[0];
    resumo = r[1];

    $('gate').hidden = true;
    $('app').hidden = false;

    desenharListas();
    desenharArvore();
  } catch (e) {
    $('gateErr').textContent = e.message;
    $('gateErr').style.display = 'block';
    $('signIn').disabled = false;
    $('signIn').textContent = 'Sign in';
  }
}


// ============================================================
// AS TRÊS LISTAS
// ============================================================

function desenharListas() {
  var espera = resumo.under_review || [];
  var recrutar = resumo.recruit_next || [];
  var socios = resumo.partners || [];

  // ---------- quem espera por nós ----------
  $('reviewPanel').hidden = !espera.length;
  $('reviewCount').textContent = espera.length;

  $('reviewList').innerHTML = espera.map(function (p) {
    var frota = [];
    if (p.sedans) frota.push(p.sedans + ' sedan');
    if (p.vans) frota.push(p.vans + ' van');
    if (p.drivers) frota.push(p.drivers + ' driver' + (p.drivers === 1 ? '' : 's'));

    return '<div class="item">' +
      '<span class="nm"><b>' + esc(p.name) + '</b>' +
        '<span>' + esc(p.country || '') +
        (frota.length ? ' · ' + esc(frota.join(' · ')) : ' · nothing registered') +
        (p.missing ? ' · missing ' + esc(p.missing.trim()) : '') +
        '</span></span>' +

      (p.airports && p.airports.length
        ? '<span class="codes">' + p.airports.slice(0, 4).map(function (c) {
            return '<span class="code-chip">' + esc(c) + '</span>';
          }).join('') +
          (p.airports.length > 4
            ? '<span class="code-chip">+' + (p.airports.length - 4) + '</span>'
            : '') +
          '</span>'
        : '<span class="code-chip">no airports</span>') +

      /**
       * Os dias à espera.
       *
       * Uma candidatura parada é um parceiro que desiste — e a
       * partir de três dias isso grita a vermelho.
       */
      '<span class="days' + (p.days_waiting >= 3 ? ' late' : '') + '">' +
        (p.days_waiting === 0 ? 'today' : p.days_waiting + 'd') +
      '</span>' +
      '</div>';
  }).join('') || '<div class="nofirms">Nobody waiting.</div>';

  // ---------- onde recrutar ----------
  $('recruitCount').textContent = recrutar.length;

  $('recruitList').innerHTML = recrutar.map(function (a) {
    return '<div class="item">' +
      '<span class="pip ' + esc(a.status) + '"></span>' +
      '<span class="code">' + esc(a.iata) + '</span>' +

      '<span class="nm"><b>' + esc(a.city) + '</b>' +
        '<span>' + esc(a.country) +
        (a.status === 'pending'
          ? ' · ' + a.pending_partners + ' under review'
          : ' · needs ' + esc((a.missing || '').trim() || 'partners')) +
        '</span></span>' +

      '<span class="bk' + (a.bookings_90d ? '' : ' zero') + '">' +
        (a.bookings_90d || 0) +
      '</span>' +
      '</div>';
  }).join('') || '<div class="nofirms">Every tier 1 airport is covered.</div>';

  // ---------- quem já temos ----------
  $('partnersCount').textContent = socios.length;

  $('partnersList').innerHTML = socios.map(function (p) {
    var frota = [];
    if (p.sedans) frota.push(p.sedans + ' sedan');
    if (p.vans) frota.push(p.vans + ' van');
    if (p.drivers) frota.push(p.drivers + ' driver' + (p.drivers === 1 ? '' : 's'));

    return '<div class="item">' +
      '<span class="nm"><b>' + esc(p.name) + '</b>' +
        '<span>' + esc(p.country || '') +
        (frota.length ? ' · ' + esc(frota.join(' · ')) : ' · no fleet registered') +
        (p.rides_90d ? ' · ' + p.rides_90d + ' rides' : '') +
        '</span></span>' +

      (p.airports && p.airports.length
        ? '<span class="codes">' + p.airports.slice(0, 5).map(function (c) {
            return '<span class="code-chip">' + esc(c) + '</span>';
          }).join('') +
          (p.airports.length > 5
            ? '<span class="code-chip">+' + (p.airports.length - 5) + '</span>'
            : '') +
          '</span>'
        : '<span class="code-chip">no airports</span>') +
      '</div>';
  }).join('') || '<div class="nofirms">No approved partners yet.</div>';

  // Os painéis abrem e fecham.
  qsa('[data-panel]').forEach(function (b) {
    b.addEventListener('click', function () {
      var nome = b.getAttribute('data-panel');
      var caixa = $(nome === 'review' ? 'reviewList'
        : nome === 'recruit' ? 'recruitList' : 'partnersList');

      caixa.hidden = !caixa.hidden;
      b.parentElement.classList.toggle('open', !caixa.hidden);
    });
  });

  /**
   * Quem espera abre sozinho.
   *
   * É o único dos três com prazo: um parceiro que se registou há
   * três dias e ninguém olhou desiste.
   */
  if (espera.length) {
    $('reviewList').hidden = false;
    $('reviewPanel').classList.add('open');
  }
}


// ============================================================
// A ÁRVORE
// ============================================================

function desenharArvore() {
  var t = arvore.totals || {};

  // ---------- a frase ----------
  if (!t.bookings) {
    $('lede').innerHTML =
      'No bookings in the last 90 days. ' +
      '<span class="big ok">' + (t.full || 0) + '</span> of ' +
      (t.airports || 0) + ' airports are fully covered.';
  } else {
    $('lede').innerHTML =
      '<span class="big bad">' + (t.demand_uncovered || 0) + '</span> of ' +
      (t.bookings || 0) + ' bookings came from airports where we cannot ' +
      'guarantee a car. ' +
      '<span class="big ok">' + (t.full || 0) + '</span> airports fully ' +
      'covered' +
      (t.pending ? ', ' + t.pending + ' with someone under review' : '') + '.';
  }

  $('when').textContent = arvore.generated_at
    ? new Date(arvore.generated_at).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      })
    : '';

  /**
   * Os continentes, por procura.
   *
   * Alfabeticamente, África vinha primeiro e a Europa a meio. Por
   * reservas, o que interessa fica em cima.
   */
  var conts = (arvore.continents || []).slice().sort(function (a, b) {
    return (b.bookings || 0) - (a.bookings || 0) || (b.airports - a.airports);
  });

  $('tree').innerHTML = conts.map(function (c) {
    return '<div class="cont" data-cont="' + esc(c.name) + '">' +
      '<button class="cont-head" type="button">' +
        '<span class="caret">▶</span>' +
        '<b>' + esc(c.name) + '</b>' +
        numeros(c) +
      '</button>' +
      '<div class="countries" hidden></div>' +
    '</div>';
  }).join('');

  qsa('.cont-head').forEach(function (b) {
    b.addEventListener('click', function () {
      abrirContinente(b.parentElement);
    });
  });
}


/**
 * Os números de um continente ou país.
 *
 * Verde, âmbar e vermelho, e as reservas. Sem isto, abrir um
 * continente às cegas é a única forma de saber se lá há alguma
 * coisa.
 */
function numeros(x) {
  var ambar = (x.partial || 0) + (x.pending || 0);

  return '<span class="mini">' +
    (x.full ? '<i class="g">' + x.full + '</i>' : '') +
    (ambar ? '<i class="a">' + ambar + '</i>' : '') +
    (x.none ? '<i class="r">' + x.none + '</i>' : '') +
    (x.bookings ? '<i>· ' + x.bookings + ' bkg</i>' : '') +
    '</span>';
}


function abrirContinente(el) {
  var caixa = el.querySelector('.countries');
  var aberto = el.classList.toggle('open');

  caixa.hidden = !aberto;
  if (!aberto) return;

  if (caixa.innerHTML) return;

  var nome = el.getAttribute('data-cont');
  var c = (arvore.continents || []).find(function (x) { return x.name === nome; });

  // Os países, por reservas e depois por nome.
  var paises = (c.countries || []).slice().sort(function (a, b) {
    return (b.bookings || 0) - (a.bookings || 0) ||
           a.name.localeCompare(b.name);
  });

  caixa.innerHTML = paises.map(function (p) {
    /**
     * O país marca-se quando precisa de gente.
     *
     * Precisa se tem reservas e não tem tudo coberto, ou se não tem
     * um único aeroporto verde. Percorrer a lista à procura de
     * números pequenos não é forma de encontrar onde falta.
     */
    var precisa = (p.bookings > 0 && p.full < p.airports) || p.full === 0;

    return '<div class="country' + (precisa ? ' needs' : '') +
      '" data-country="' + esc(p.name) + '">' +
      '<button class="ct-head" type="button">' +
        '<span class="caret">▶</span>' +
        '<b>' + esc(p.name) + '</b>' +
        numeros(p) +
      '</button>' +
      '<div class="airports" hidden></div>' +
    '</div>';
  }).join('');

  qsa('.ct-head', caixa).forEach(function (b) {
    b.addEventListener('click', function () {
      abrirPais(b.parentElement);
    });
  });
}


async function abrirPais(el) {
  var caixa = el.querySelector('.airports');
  var aberto = el.classList.toggle('open');

  caixa.hidden = !aberto;
  if (!aberto) return;

  if (caixa.innerHTML) return;

  var nome = el.getAttribute('data-country');

  caixa.innerHTML = '<div class="loading">Loading...</div>';

  try {
    if (!cache[nome]) {
      var r = await pedir('/api/maps/country?name=' + encodeURIComponent(nome));
      cache[nome] = r.airports || [];
    }

    pintarAeroportos(caixa, cache[nome]);
  } catch (e) {
    caixa.innerHTML = '<div class="loading">' + esc(e.message) + '</div>';
  }
}


function pintarAeroportos(caixa, lista) {
  if (!lista.length) {
    caixa.innerHTML = '<div class="loading">No airports here.</div>';
    return;
  }

  caixa.innerHTML = lista.map(function (a) {
    var quantas = (a.partners || 0) + (a.pending_partners || 0);

    return '<button class="ap tier' + (a.tier || 3) +
      '" data-iata="' + esc(a.iata) + '" type="button">' +

      '<span class="pip ' + esc(a.status) + '"></span>' +
      '<span class="code">' + esc(a.iata) + '</span>' +

      '<span class="place"><b>' + esc(a.city || a.name) + '</b></span>' +

      /**
       * O estado em palavras, não só em cor.
       *
       * "Needs 2 sedan 1 van" leva-se para uma conversa. Um ponto
       * âmbar não — e quem for daltónico não vê nada.
       */
      '<span class="state ' + esc(a.status) + '">' +
        (a.status === 'full' ? 'covered'
          : a.status === 'pending' ? 'under review'
          : a.status === 'partial'
            ? 'needs ' + esc((a.missing || '').trim())
            : 'nobody') +
      '</span>' +

      (quantas
        ? '<span class="mini"><i>' + quantas + ' co.</i></span>'
        : '') +

      '<span class="bk' + (a.bookings_90d ? '' : ' zero') + '">' +
        (a.bookings_90d || 0) + '</span>' +

      '</button>' +

      '<div class="firms" data-firms="' + esc(a.iata) + '" hidden></div>';
  }).join('');

  qsa('[data-iata]', caixa).forEach(function (b) {
    b.addEventListener('click', function () {
      var iata = b.getAttribute('data-iata');
      var alvo = caixa.querySelector('[data-firms="' + iata + '"]');

      alvo.hidden = !alvo.hidden;

      if (!alvo.hidden && !alvo.innerHTML) {
        var a = lista.find(function (x) { return x.iata === iata; });
        pintarEmpresas(alvo, a);
      }
    });
  });
}


/**
 * O que se passa num aeroporto.
 *
 * Os parceiros que lá temos, e as empresas com quem estamos a
 * falar. Sem a segunda parte, dois vendedores ligam à mesma
 * empresa na mesma semana.
 */
async function pintarEmpresas(caixa, a) {
  caixa.innerHTML = '<div class="nofirms">Loading...</div>';

  var d;

  try {
    d = await pedir('/api/maps/pipeline?iata=' + encodeURIComponent(a.iata));
  } catch (e) {
    caixa.innerHTML = '<div class="nofirms">' + esc(e.message) + '</div>';
    return;
  }

  var html = '';

  // ---------- quem trata daqui ----------
  html += '<div class="owner-bar">' +
    (d.owner
      ? '<span>Owned by <b>' + esc(d.owner.name || 'someone') + '</b></span>'
      : '<span class="muted">Nobody owns this airport</span>') +
    '<button class="mini-btn" data-claim="' + esc(a.iata) + '">' +
      (d.owner ? 'Take over' : 'I will take it') + '</button>' +
    '</div>';

  // ---------- os parceiros ----------
  var socios = d.partners || [];

  if (socios.length) {
    html += '<div class="sec-label">Partners here</div>' +
      socios.map(function (c) {
        var frota = [];
        if (c.sedans) frota.push(c.sedans + ' sedan');
        if (c.vans) frota.push(c.vans + ' van');
        if (c.drivers) frota.push(c.drivers + ' driver' + (c.drivers === 1 ? '' : 's'));

        return '<div class="firm">' +
          '<span class="nm"><b>' + esc(c.name) + '</b>' +
            '<span>' +
            (frota.length ? esc(frota.join(' · ')) : 'nothing registered yet') +
            (c.status !== 'approved' && c.missing
              ? ' · missing ' + esc(c.missing.trim()) : '') +
            '</span></span>' +
          '<span class="tag ' + esc(c.status) + '">' +
            esc(c.status === 'in_review' ? 'under review' : c.status) +
          '</span></div>';
      }).join('');
  }

  /**
   * As empresas que andamos a contactar.
   *
   * É a parte que faltava. Quem já se falou, o que se disse, e em
   * que ponto está — para o trabalho não se repetir.
   */
  var leads = d.leads || [];

  html += '<div class="sec-label">Companies we are talking to' +
    (leads.length ? ' (' + leads.length + ')' : '') + '</div>';

  html += leads.length
    ? leads.map(cartaoLead).join('')
    : '<div class="nofirms">Nobody contacted here yet.</div>';

  // E um botão para acrescentar.
  html += '<button class="add-lead" data-add="' + esc(a.iata) +
    '" type="button">+ Add a company to contact</button>';

  caixa.innerHTML = html;

  ligarAcoes(caixa, a);
}


function cartaoLead(l) {
  var ultimo = (l.touches || [])[0];

  var frota = [];
  if (l.sedans) frota.push(l.sedans + ' sedan');
  if (l.vans) frota.push(l.vans + ' van');

  return '<div class="lead" data-lead="' + esc(l.id) + '">' +

    '<div class="lead-top">' +
      '<b>' + esc(l.company) + '</b>' +
      '<span class="tag ' + esc(l.stage) + '">' + esc(l.stage) + '</span>' +
    '</div>' +

    '<div class="lead-info">' +
      (l.phone ? esc(l.phone) + ' · ' : '') +
      (l.email ? esc(l.email) + ' · ' : '') +
      (frota.length ? esc(frota.join(', ')) : esc(l.fleet || 'fleet unknown')) +
    '</div>' +

    /**
     * A última coisa que se disse.
     *
     * É o que faz a diferença entre continuar uma conversa e
     * começar outra do zero — e o cliente nota a diferença.
     */
    (ultimo
      ? '<div class="lead-note">' +
          '<b>' + esc(ultimo.by || 'someone') + '</b> · ' +
          esc(new Date(ultimo.at).toLocaleDateString('en-GB', {
            day: '2-digit', month: 'short' })) + ' · ' +
          esc(ultimo.note) +
        '</div>'
      : '') +

    (l.next_action
      ? '<div class="lead-next">Next: ' + esc(l.next_action) + '</div>'
      : '') +

    '<div class="lead-acts">' +
      '<button class="mini-btn" data-touch="' + esc(l.id) + '">Log a call</button>' +
      (l.contacts ? '<span class="muted">' + l.contacts + ' contacts</span>' : '') +
    '</div>' +

    '</div>';
}


function ligarAcoes(caixa, a) {
  // Ficar com o aeroporto.
  qsa('[data-claim]', caixa).forEach(function (b) {
    b.addEventListener('click', async function () {
      try {
        await enviar('/api/maps/owner', { iata: b.getAttribute('data-claim') });
        pintarEmpresas(caixa, a);
      } catch (e) { alert(e.message); }
    });
  });

  // Registar um contacto.
  qsa('[data-touch]', caixa).forEach(function (b) {
    b.addEventListener('click', function () {
      abrirTouch(b.getAttribute('data-touch'), caixa, a);
    });
  });

  // Acrescentar uma empresa.
  qsa('[data-add]', caixa).forEach(function (b) {
    b.addEventListener('click', function () {
      abrirNovoLead(b.getAttribute('data-add'), caixa, a);
    });
  });
}


/**
 * Registar um contacto.
 *
 * A nota é obrigatória, e é de propósito: "liguei" sem dizer o que
 * se disse não serve a ninguém.
 */
async function abrirTouch(id, caixa, a) {
  var nota = prompt('What was said?\n\n' +
    'Write it as if for somebody else to pick this up tomorrow.');

  if (!nota || !nota.trim()) return;

  var fase = prompt(
    'New stage? Leave empty to keep it as it is.\n\n' +
    'contacted · interested · signing · declined · unreachable'
  );

  var quando = prompt(
    'Call back on? (YYYY-MM-DD)\n\n' +
    'Leave empty if there is nothing to chase.'
  );

  try {
    await enviar('/api/maps/touch', {
      lead_id: id,
      kind: 'call',
      note: nota.trim(),
      stage: (fase || '').trim() || null,
      next_action: (quando || '').trim() || null
    });

    pintarEmpresas(caixa, a);
  } catch (e) {
    alert(e.message);
  }
}


async function abrirNovoLead(iata, caixa, a) {
  var nome = prompt('Company name');
  if (!nome || !nome.trim()) return;

  var tel = prompt('Phone (optional)') || '';
  var mail = prompt('Email (optional)') || '';
  var frota = prompt('What do they have? (optional)\n\n' +
    'e.g. "8 cars, 2 vans, airport transfers since 2015"') || '';

  try {
    await enviar('/api/maps/lead', {
      company_name: nome.trim(),
      airports: [iata],
      country: a.country || null,
      phone: tel.trim() || null,
      email: mail.trim() || null,
      fleet_note: frota.trim() || null
    });

    pintarEmpresas(caixa, a);
  } catch (e) {
    alert(e.message);
  }
}


async function enviar(caminho, corpo) {
  var s = await db.auth.getSession();
  var token = s.data && s.data.session && s.data.session.access_token;

  if (!token) throw new Error('Sign in again.');

  var res = await fetch(API + caminho, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + token
    },
    body: JSON.stringify(corpo)
  });

  var d = await res.json();
  if (!res.ok) throw new Error(d.error || 'Could not save.');

  return d;
}


// ============================================================
// A PESQUISA
//
// Quem sabe o que quer não devia ter de abrir três níveis.
// ============================================================

var achaTimer = null;

$('find').addEventListener('input', function () {
  var q = $('find').value.trim().toLowerCase();

  clearTimeout(achaTimer);

  if (q.length < 2) {
    desenharArvore();
    return;
  }

  achaTimer = setTimeout(function () { procurar(q); }, 250);
});


async function procurar(q) {
  /**
   * Procura nos países primeiro.
   *
   * Se bater num país, abre-o inteiro — é o que alguém que escreve
   * "Spain" quer ver. Se não, procura nos aeroportos já
   * carregados.
   */
  var paises = [];

  (arvore.continents || []).forEach(function (c) {
    (c.countries || []).forEach(function (p) {
      if (p.name.toLowerCase().indexOf(q) !== -1) paises.push(p.name);
    });
  });

  if (paises.length) {
    $('tree').innerHTML = '<div class="loading">Loading...</div>';

    var partes = [];

    for (var i = 0; i < Math.min(paises.length, 4); i++) {
      var nome = paises[i];

      if (!cache[nome]) {
        var r = await pedir('/api/maps/country?name=' + encodeURIComponent(nome));
        cache[nome] = r.airports || [];
      }

      partes.push('<div class="country open">' +
        '<div class="ct-head"><b>' + esc(nome) + '</b></div>' +
        '<div class="airports" data-c="' + esc(nome) + '"></div></div>');
    }

    $('tree').innerHTML = partes.join('');

    qsa('[data-c]').forEach(function (caixa) {
      pintarAeroportos(caixa, cache[caixa.getAttribute('data-c')]);
    });

    return;
  }

  /**
   * Sem país, procura nos aeroportos que já estão carregados.
   *
   * Não vai ao servidor: procurar 801 aeroportos por cada tecla
   * seria uma chamada por tecla, e o que se ganha não paga a
   * espera.
   */
  var achados = [];

  Object.keys(cache).forEach(function (pais) {
    cache[pais].forEach(function (a) {
      if ((a.city || '').toLowerCase().indexOf(q) !== -1 ||
          (a.iata || '').toLowerCase() === q) {
        achados.push(a);
      }
    });
  });

  if (!achados.length) {
    $('tree').innerHTML =
      '<div class="loading">Nothing loaded matches. ' +
      'Open a country first, or search by country name.</div>';
    return;
  }

  $('tree').innerHTML = '<div class="airports" id="found"></div>';
  pintarAeroportos($('found'), achados);
}


$('theme').addEventListener('click', function () {
  var escuro = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', escuro ? 'light' : 'dark');
  $('theme').textContent = escuro ? 'Dark' : 'Light';
});


(async function () {
  var s = await db.auth.getSession();
  if (s.data && s.data.session) carregar();
})();

})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coverage · Airportlink</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">

<style>
/* ============================================================
   ONDE PODEMOS OPERAR

   Continente, país, aeroporto. Cada nível abre o seguinte, e só
   se carrega o que se abre — 801 aeroportos de uma vez não se
   navegam.

   As cores dizem o estado:
     verde     dois sedans, duas vans, dois motoristas
     âmbar     há frota mas não chega, ou há alguém em análise
     vermelho  ninguém
   ============================================================ */
:root{
  --bg:#FAFAF8; --card:#FFFFFF; --card-2:#F4F4F1;
  --text:#1A1A17; --muted:#6B6B63;
  --border:#E4E4DE; --border-soft:#EFEFEA;
  --teal:#0D9488;
  --ok:#16A34A; --warn:#CA8A04; --bad:#DC2626;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
}

[data-theme="dark"]{
  --bg:#0F1115; --card:#171A20; --card-2:#1E222A;
  --text:#F0F0EC; --muted:#9A9A93;
  --border:#282D36; --border-soft:#21252C;
}

*{box-sizing:border-box}

body{margin:0;font-family:var(--sans);background:var(--bg);
  color:var(--text);-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.5}

.wrap{max-width:880px;margin:0 auto;padding:0 20px 80px}

.top{display:flex;align-items:baseline;gap:14px;padding:26px 0 18px;
  flex-wrap:wrap}
.top h1{margin:0;font-size:21px;font-weight:600}
.top .when{font-size:12.5px;color:var(--muted)}
.grow{flex:1 1 auto}

.btn{padding:6px 13px;border-radius:9px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-family:inherit;
  font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{color:var(--text)}
.btn.on{background:var(--text);color:var(--card);border-color:var(--text)}

/* ---------- a frase que resume ---------- */
.lede{margin:0 0 24px;padding:17px 20px;border-radius:14px;
  background:var(--card);border:1px solid var(--border);
  font-size:16px;line-height:1.6}
.lede .big{font-family:var(--mono);font-size:19px;font-weight:600}
.lede .bad{color:var(--bad)}
.lede .ok{color:var(--ok)}

/* ---------- a pesquisa ---------- */
.find{width:100%;padding:11px 15px;margin-bottom:20px;
  border:1px solid var(--border);border-radius:11px;
  background:var(--card);font-family:inherit;font-size:14.5px;
  color:var(--text)}
.find:focus{outline:none;border-color:var(--teal)}

/* ============================================================
   A ÁRVORE
   ============================================================ */
.tree{border:1px solid var(--border);border-radius:14px;overflow:hidden}

/* ---------- continente ---------- */
.cont{background:var(--card)}
.cont + .cont{border-top:1px solid var(--border)}

.cont-head{display:flex;align-items:center;gap:12px;width:100%;
  padding:15px 18px;background:transparent;border:none;cursor:pointer;
  font-family:inherit;font-size:15.5px;color:var(--text);text-align:left}
.cont-head:hover{background:var(--card-2)}
.cont-head b{font-weight:600;flex:1 1 auto}

.caret{font-size:11px;color:var(--muted);transition:transform .15s;
  flex:0 0 auto}
.cont.open .caret{transform:rotate(90deg)}

/* ---------- país ---------- */
.country{background:var(--card-2)}
.country + .country{border-top:1px solid var(--border-soft)}

.ct-head{display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 18px 11px 34px;background:transparent;border:none;
  cursor:pointer;font-family:inherit;font-size:14px;color:var(--text);
  text-align:left}
.ct-head:hover{background:var(--border-soft)}
.ct-head b{font-weight:500;flex:1 1 auto}

/* ---------- aeroporto ---------- */
.airports{background:var(--card)}

.ap{display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 18px 11px 50px;background:transparent;border:none;
  cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--text);
  text-align:left}
.ap + .ap{border-top:1px solid var(--border-soft)}
.ap:hover{background:var(--card-2)}

.ap .code{font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--muted);flex:0 0 auto;width:34px}

.ap .place{flex:1 1 auto;min-width:0}
.ap .place b{font-weight:500}

/* O nível 1 destaca-se: são os grandes destinos, onde um parceiro
   novo tem trabalho desde o primeiro dia. */
.ap.tier1 .place b{font-weight:600}
.ap.tier1 .code{color:var(--text)}

.pip{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.pip.full{background:var(--ok)}
.pip.partial{background:var(--warn)}
.pip.pending{background:var(--warn)}
.pip.none{background:var(--bad)}

.state{font-size:12px;font-weight:600;flex:0 0 auto;text-align:right}
.state.full{color:var(--ok)}
.state.partial,.state.pending{color:var(--warn)}
.state.none{color:var(--bad)}

.bk{font-family:var(--mono);font-size:12px;font-weight:600;
  flex:0 0 auto;min-width:52px;text-align:right;color:var(--text)}
.bk.zero{color:var(--muted);font-weight:400}

/* ---------- as empresas ---------- */
.firms{padding:4px 18px 14px 50px;background:var(--card-2)}

.firm{display:flex;align-items:center;gap:11px;padding:9px 14px;
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;font-size:13px}
.firm + .firm{margin-top:6px}

.firm .nm{flex:1 1 auto;min-width:0}
.firm .nm b{display:block;font-weight:600}
.firm .nm span{font-size:12px;color:var(--muted)}

.tag{font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;
  border-radius:5px;flex:0 0 auto}
.tag.approved{background:rgba(22,163,74,.13);color:var(--ok)}
.tag.pending,.tag.submitted,.tag.in_review{
  background:rgba(202,138,4,.15);color:var(--warn)}
.tag.suspended,.tag.draft{background:var(--card-2);color:var(--muted)}

.nofirms{padding:11px 14px;font-size:13px;color:var(--muted);
  font-style:italic}

/* ---------- números pequenos ---------- */
.mini{display:flex;gap:8px;flex:0 0 auto;font-family:var(--mono);
  font-size:11.5px;color:var(--muted)}
.mini i{font-style:normal}
.mini .g{color:var(--ok)}
.mini .a{color:var(--warn)}
.mini .r{color:var(--bad)}

/* ---------- o portão ---------- */
.gate{max-width:360px;margin:90px auto;padding:28px;
  background:var(--card);border:1px solid var(--border);border-radius:18px}
.gate h1{margin:0 0 6px;font-size:19px}
.gate p{margin:0 0 18px;font-size:13.5px;color:var(--muted)}

.gate input{width:100%;padding:11px 14px;margin-bottom:10px;
  border:1px solid var(--border);border-radius:10px;
  background:var(--card-2);font-family:inherit;font-size:15px;
  color:var(--text)}
.gate input:focus{outline:none;border-color:var(--teal)}

.gate button{width:100%;padding:11px;border:none;border-radius:10px;
  background:var(--teal);color:#fff;font-family:inherit;font-size:14px;
  font-weight:600;cursor:pointer}

.err{margin-top:12px;padding:10px 13px;border-radius:9px;
  background:rgba(220,38,38,.1);color:var(--bad);font-size:13px;
  display:none}

.loading{padding:14px 50px;font-size:13px;color:var(--muted)}

@media (max-width:600px){
  .wrap{padding:0 12px 60px}
  .ap{padding-left:34px;flex-wrap:wrap}
  .ap .state{flex:1 1 100%;text-align:left;order:5;padding-left:45px}
  .firms{padding-left:34px}
  .ct-head{padding-left:28px}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Coverage</h1>
  <p>Where we can operate, and where we cannot.
     Administrator sign-in required.</p>

  <input type="email" id="email" placeholder="Email" autocomplete="username">
  <input type="password" id="pass" placeholder="Password"
         autocomplete="current-password">
  <button id="signIn" type="button">Sign in</button>

  <div class="err" id="gateErr"></div>
</div>


<div class="wrap" id="app" hidden>

  <div class="top">
    <h1>Coverage</h1>
    <span class="when" id="when"></span>
    <span class="grow"></span>
    <button class="btn" id="theme" type="button">Dark</button>
  </div>

  <p class="lede" id="lede"></p>

  <!-- Procurar salta a árvore toda. Quem sabe o que quer não
       devia ter de abrir três níveis para lá chegar. -->
  <input type="text" id="find" class="find"
         placeholder="Jump to an airport or country — Faro, Dubai, Spain...">

  <div class="tree" id="tree"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://airportlink.onrender.com/api/maps/config.js"></script>

<script>
(function () {
'use strict';

var CFG = window.MAP_CFG || {};
var API = CFG.apiUrl || 'https://airportlink.onrender.com';

var $ = function (id) { return document.getElementById(id); };
var qsa = function (s, raiz) {
  return Array.prototype.slice.call((raiz || document).querySelectorAll(s));
};

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) {
  $('gateErr').textContent = 'The server did not send the sign-in settings. ' +
    'Check SUPABASE_URL and SUPABASE_ANON_KEY on Render.';
  $('gateErr').style.display = 'block';
  return;
}

var db = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);

var arvore = null;

/**
 * Os países já carregados.
 *
 * Abrir um país pede os aeroportos dele ao servidor. Guardá-los
 * evita pedir outra vez quando alguém fecha e reabre — o que
 * acontece muito ao navegar.
 */
var cache = {};


// ============================================================
// O PORTÃO
// ============================================================

$('signIn').addEventListener('click', async function () {
  var b = $('signIn');
  b.disabled = true;
  b.textContent = 'Signing in...';
  $('gateErr').style.display = 'none';

  try {
    var r = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('pass').value
    });

    if (r.error) throw new Error(r.error.message);
    await carregar();
  } catch (e) {
    $('gateErr').textContent = e.message;
    $('gateErr').style.display = 'block';
    b.disabled = false;
    b.textContent = 'Sign in';
  }
});

['email', 'pass'].forEach(function (id) {
  $(id).addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('signIn').click();
  });
});


async function pedir(caminho) {
  var s = await db.auth.getSession();
  var token = s.data && s.data.session && s.data.session.access_token;

  if (!token) throw new Error('Sign in again.');

  var res = await fetch(API + caminho, {
    headers: { Authorization: 'Bearer ' + token }
  });

  var d = await res.json();
  if (!res.ok) throw new Error(d.error || 'Could not load.');

  return d;
}


async function carregar() {
  try {
    arvore = await pedir('/api/maps/tree');

    $('gate').hidden = true;
    $('app').hidden = false;

    desenharArvore();
  } catch (e) {
    $('gateErr').textContent = e.message;
    $('gateErr').style.display = 'block';
    $('signIn').disabled = false;
    $('signIn').textContent = 'Sign in';
  }
}


// ============================================================
// A ÁRVORE
// ============================================================

function desenharArvore() {
  var t = arvore.totals || {};

  // ---------- a frase ----------
  if (!t.bookings) {
    $('lede').innerHTML =
      'No bookings in the last 90 days. ' +
      '<span class="big ok">' + (t.full || 0) + '</span> of ' +
      (t.airports || 0) + ' airports are fully covered.';
  } else {
    $('lede').innerHTML =
      '<span class="big bad">' + (t.demand_uncovered || 0) + '</span> of ' +
      (t.bookings || 0) + ' bookings came from airports where we cannot ' +
      'guarantee a car. ' +
      '<span class="big ok">' + (t.full || 0) + '</span> airports fully ' +
      'covered' +
      (t.pending ? ', ' + t.pending + ' with someone under review' : '') + '.';
  }

  $('when').textContent = arvore.generated_at
    ? new Date(arvore.generated_at).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      })
    : '';

  /**
   * Os continentes, por procura.
   *
   * Alfabeticamente, África vinha primeiro e a Europa a meio. Por
   * reservas, o que interessa fica em cima.
   */
  var conts = (arvore.continents || []).slice().sort(function (a, b) {
    return (b.bookings || 0) - (a.bookings || 0) || (b.airports - a.airports);
  });

  $('tree').innerHTML = conts.map(function (c) {
    return '<div class="cont" data-cont="' + esc(c.name) + '">' +
      '<button class="cont-head" type="button">' +
        '<span class="caret">▶</span>' +
        '<b>' + esc(c.name) + '</b>' +
        numeros(c) +
      '</button>' +
      '<div class="countries" hidden></div>' +
    '</div>';
  }).join('');

  qsa('.cont-head').forEach(function (b) {
    b.addEventListener('click', function () {
      abrirContinente(b.parentElement);
    });
  });
}


/**
 * Os números de um continente ou país.
 *
 * Verde, âmbar e vermelho, e as reservas. Sem isto, abrir um
 * continente às cegas é a única forma de saber se lá há alguma
 * coisa.
 */
function numeros(x) {
  var ambar = (x.partial || 0) + (x.pending || 0);

  return '<span class="mini">' +
    (x.full ? '<i class="g">' + x.full + '</i>' : '') +
    (ambar ? '<i class="a">' + ambar + '</i>' : '') +
    (x.none ? '<i class="r">' + x.none + '</i>' : '') +
    (x.bookings ? '<i>· ' + x.bookings + ' bkg</i>' : '') +
    '</span>';
}


function abrirContinente(el) {
  var caixa = el.querySelector('.countries');
  var aberto = el.classList.toggle('open');

  caixa.hidden = !aberto;
  if (!aberto) return;

  if (caixa.innerHTML) return;

  var nome = el.getAttribute('data-cont');
  var c = (arvore.continents || []).find(function (x) { return x.name === nome; });

  // Os países, por reservas e depois por nome.
  var paises = (c.countries || []).slice().sort(function (a, b) {
    return (b.bookings || 0) - (a.bookings || 0) ||
           a.name.localeCompare(b.name);
  });

  caixa.innerHTML = paises.map(function (p) {
    return '<div class="country" data-country="' + esc(p.name) + '">' +
      '<button class="ct-head" type="button">' +
        '<span class="caret">▶</span>' +
        '<b>' + esc(p.name) + '</b>' +
        numeros(p) +
      '</button>' +
      '<div class="airports" hidden></div>' +
    '</div>';
  }).join('');

  qsa('.ct-head', caixa).forEach(function (b) {
    b.addEventListener('click', function () {
      abrirPais(b.parentElement);
    });
  });
}


async function abrirPais(el) {
  var caixa = el.querySelector('.airports');
  var aberto = el.classList.toggle('open');

  caixa.hidden = !aberto;
  if (!aberto) return;

  if (caixa.innerHTML) return;

  var nome = el.getAttribute('data-country');

  caixa.innerHTML = '<div class="loading">Loading...</div>';

  try {
    if (!cache[nome]) {
      var r = await pedir('/api/maps/country?name=' + encodeURIComponent(nome));
      cache[nome] = r.airports || [];
    }

    pintarAeroportos(caixa, cache[nome]);
  } catch (e) {
    caixa.innerHTML = '<div class="loading">' + esc(e.message) + '</div>';
  }
}


function pintarAeroportos(caixa, lista) {
  if (!lista.length) {
    caixa.innerHTML = '<div class="loading">No airports here.</div>';
    return;
  }

  caixa.innerHTML = lista.map(function (a) {
    var quantas = (a.partners || 0) + (a.pending_partners || 0);

    return '<button class="ap tier' + (a.tier || 3) +
      '" data-iata="' + esc(a.iata) + '" type="button">' +

      '<span class="pip ' + esc(a.status) + '"></span>' +
      '<span class="code">' + esc(a.iata) + '</span>' +

      '<span class="place"><b>' + esc(a.city || a.name) + '</b></span>' +

      /**
       * O estado em palavras, não só em cor.
       *
       * "Needs 2 sedan 1 van" leva-se para uma conversa. Um ponto
       * âmbar não — e quem for daltónico não vê nada.
       */
      '<span class="state ' + esc(a.status) + '">' +
        (a.status === 'full' ? 'covered'
          : a.status === 'pending' ? 'under review'
          : a.status === 'partial'
            ? 'needs ' + esc((a.missing || '').trim())
            : 'nobody') +
      '</span>' +

      (quantas
        ? '<span class="mini"><i>' + quantas + ' co.</i></span>'
        : '') +

      '<span class="bk' + (a.bookings_90d ? '' : ' zero') + '">' +
        (a.bookings_90d || 0) + '</span>' +

      '</button>' +

      '<div class="firms" data-firms="' + esc(a.iata) + '" hidden></div>';
  }).join('');

  qsa('[data-iata]', caixa).forEach(function (b) {
    b.addEventListener('click', function () {
      var iata = b.getAttribute('data-iata');
      var alvo = caixa.querySelector('[data-firms="' + iata + '"]');

      alvo.hidden = !alvo.hidden;

      if (!alvo.hidden && !alvo.innerHTML) {
        var a = lista.find(function (x) { return x.iata === iata; });
        pintarEmpresas(alvo, a);
      }
    });
  });
}


/**
 * As empresas de um aeroporto.
 *
 * Incluindo as que estão por aprovar — são o que distingue um
 * aeroporto onde alguém se registou ontem de um vazio. Sem isto,
 * alguém ia recrutar para um sítio onde já há candidatura.
 */
function pintarEmpresas(caixa, a) {
  var lista = (a && a.companies) || [];

  if (!lista.length) {
    caixa.innerHTML = '<div class="nofirms">No company covers this airport.</div>';
    return;
  }

  caixa.innerHTML = lista.map(function (c) {
    var frota = [];
    if (c.sedans) frota.push(c.sedans + ' sedan');
    if (c.vans) frota.push(c.vans + ' van');
    if (c.drivers) frota.push(c.drivers + ' driver' + (c.drivers === 1 ? '' : 's'));

    return '<div class="firm">' +
      '<span class="nm"><b>' + esc(c.name) + '</b>' +
        '<span>' +
        (frota.length ? esc(frota.join(' · ')) : 'nothing registered yet') +
        (c.status !== 'approved' && c.missing
          ? ' · missing ' + esc(c.missing.trim())
          : '') +
        '</span></span>' +

      '<span class="tag ' + esc(c.status) + '">' +
        esc(c.status === 'in_review' ? 'under review' : c.status) +
      '</span>' +
      '</div>';
  }).join('');
}


// ============================================================
// A PESQUISA
//
// Quem sabe o que quer não devia ter de abrir três níveis.
// ============================================================

var achaTimer = null;

$('find').addEventListener('input', function () {
  var q = $('find').value.trim().toLowerCase();

  clearTimeout(achaTimer);

  if (q.length < 2) {
    desenharArvore();
    return;
  }

  achaTimer = setTimeout(function () { procurar(q); }, 250);
});


async function procurar(q) {
  /**
   * Procura nos países primeiro.
   *
   * Se bater num país, abre-o inteiro — é o que alguém que escreve
   * "Spain" quer ver. Se não, procura nos aeroportos já
   * carregados.
   */
  var paises = [];

  (arvore.continents || []).forEach(function (c) {
    (c.countries || []).forEach(function (p) {
      if (p.name.toLowerCase().indexOf(q) !== -1) paises.push(p.name);
    });
  });

  if (paises.length) {
    $('tree').innerHTML = '<div class="loading">Loading...</div>';

    var partes = [];

    for (var i = 0; i < Math.min(paises.length, 4); i++) {
      var nome = paises[i];

      if (!cache[nome]) {
        var r = await pedir('/api/maps/country?name=' + encodeURIComponent(nome));
        cache[nome] = r.airports || [];
      }

      partes.push('<div class="country open">' +
        '<div class="ct-head"><b>' + esc(nome) + '</b></div>' +
        '<div class="airports" data-c="' + esc(nome) + '"></div></div>');
    }

    $('tree').innerHTML = partes.join('');

    qsa('[data-c]').forEach(function (caixa) {
      pintarAeroportos(caixa, cache[caixa.getAttribute('data-c')]);
    });

    return;
  }

  /**
   * Sem país, procura nos aeroportos que já estão carregados.
   *
   * Não vai ao servidor: procurar 801 aeroportos por cada tecla
   * seria uma chamada por tecla, e o que se ganha não paga a
   * espera.
   */
  var achados = [];

  Object.keys(cache).forEach(function (pais) {
    cache[pais].forEach(function (a) {
      if ((a.city || '').toLowerCase().indexOf(q) !== -1 ||
          (a.iata || '').toLowerCase() === q) {
        achados.push(a);
      }
    });
  });

  if (!achados.length) {
    $('tree').innerHTML =
      '<div class="loading">Nothing loaded matches. ' +
      'Open a country first, or search by country name.</div>';
    return;
  }

  $('tree').innerHTML = '<div class="airports" id="found"></div>';
  pintarAeroportos($('found'), achados);
}


$('theme').addEventListener('click', function () {
  var escuro = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', escuro ? 'light' : 'dark');
  $('theme').textContent = escuro ? 'Dark' : 'Light';
});
